<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐾 Open 貓貓 - 終極真貓聲合唱版</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f7f9fc; color: #333; margin: 0; padding: 15px; padding-bottom: 70px; }
    h1 { text-align: center; color: #ff6b6b; font-size: 28px; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #666; font-size: 16px; margin-top: 0; }
    
    .section-title { font-size: 22px; color: #2d3436; border-left: 5px solid #ff6b6b; padding-left: 10px; margin: 25px 0 15px; }
    
    /* 1. 專屬背景音樂 (置頂) */
    .music-box { background: #74b9ff; color: white; padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(116,185,255,0.3); }
    .music-box input { display: none; }
    .custom-upload-btn { background: #0984e3; color: white; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; display: inline-block; margin-top: 8px; }
    audio { width: 100%; margin-top: 10px; border-radius: 10px; }

    /* 2. 貓叫聲大按鈕網格 */
    .sound-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    .sound-btn { 
      background: white; border: 2px solid #ffeaa7; border-radius: 15px; padding: 12px 8px; 
      text-align: center; cursor: pointer; font-size: 15px; font-weight: bold; color: #d63031;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.1s;
    }
    .sound-btn:active { transform: scale(0.92); background: #ffeaa7; }
    .sound-btn span { display: block; font-size: 24px; margin-bottom: 5px; }

    /* 底部翻譯浮條 */
    .toast-box { 
      position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(45, 52, 54, 0.9); color: white; padding: 12px 24px; border-radius: 25px;
      font-size: 17px; font-weight: bold; display: none; z-index: 2000; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      text-align: center; max-width: 90%;
    }

    /* 3. 上傳與相簿區 */
    .upload-box { background: #eccc68; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 15px; }
    .upload-box input { display: none; }
    
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
    .photo-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; padding-bottom: 10px; position: relative; }
    .photo-card img { width: 100%; height: 160px; object-fit: cover; cursor: pointer; }
    .photo-card p { margin: 8px 0 0; font-weight: bold; font-size: 16px; color: #2d3436; }
    .delete-btn { position: absolute; top: 5px; right: 5px; background: rgba(214, 48, 49, 0.8); color: white; border: none; border-radius: 50%; width: 28px; height: 28px; font-weight: bold; cursor: pointer; }

    /* 全螢幕放大燈箱 */
    .lightbox { 
      display: none; position: fixed; top:0; left:0; width:100%; height:100%; 
      background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; flex-direction: column;
    }
    .lightbox img { max-width: 90%; max-height: 80%; border-radius: 10px; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
    .lightbox p { color: white; font-size: 22px; margin-top: 15px; font-weight: bold; }
    .close-btn { position: absolute; top: 20px; right: 25px; color: white; font-size: 35px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <h1>🐾 Open 貓貓助手</h1>
  <p class="subtitle">綁定真貓聲 + 自訂離線 MP3 + 專屬大相簿</p>

  <!-- 1. 🎵 專屬背景音樂 (置頂，自訂永久 Save) -->
  <div class="music-box">
    <strong>🎵 專屬背景音樂 / 自訂 MP3：</strong><br>
    <label class="custom-upload-btn" for="musicInput">➕ 揼入自己鍾意嘅 MP3</label>
    <input type="file" id="musicInput" onchange="uploadMusic(event)">
    <div id="musicName" style="margin-top: 8px; font-weight: bold;">（未選擇音樂）</div>
    <audio id="bgPlayer" controls style="display: none;"></audio>
  </div>

  <!-- 2. 🔊 綁定真貓叫聲區 -->
  <div class="section-title">🔊 30 種真貓語解密（按鈕即播真貓聲！）</div>
  <div class="sound-grid" id="soundGrid"></div>

  <!-- 3. 🖼️ 專屬相簿區 (自訂永久 Save) -->
  <div class="section-title">🖼️ 主人與喵星人專屬相簿（永久 Save 喺手機）</div>
  
  <div class="upload-box">
    <label class="custom-upload-btn" style="background: #d63031;" for="photoInput">📸 加新相片（自動 Save）</label>
    <input type="file" id="photoInput" accept="image/*" onchange="uploadPhoto(event)">
  </div>

  <div class="photo-grid" id="photoGrid"></div>

  <!-- 底部翻譯浮條 -->
  <div class="toast-box" id="toast"></div>

  <!-- 燈箱 -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="close-btn">&times;</span>
    <img id="lightboxImg" src="">
    <p id="lightboxCaption"></p>
  </div>

  <script>
    let db;
    const request = indexedDB.open("OpenMeowDB", 1);
    request.onupgradeneeded = function(e) {
      db = e.target.result;
      if (!db.objectStoreNames.contains("photos")) db.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
      if (!db.objectStoreNames.contains("music")) db.createObjectStore("music", { keyPath: "id" });
    };
    request.onsuccess = function(e) {
      db = e.target.result;
      loadSavedPhotos();
      loadSavedMusic();
    };

    // 🐾 30 個綁定 App 內建真貓叫聲 (對應 GitHub 上傳嘅 cat1.mp3, cat2.mp3...)
    const catSounds = [
      { name: "打招呼喵", emoji: "😺", desc: "奴才你返嚟啦！", file: "cat1.mp3" },
      { name: "要罐罐喵", emoji: "🍖", desc: "快啲開罐罐！急需要！", file: "cat2.mp3" },
      { name: "急促討食", emoji: "⚡", desc: "動作太慢，扣 50 分！", file: "cat3.mp3" },
      { name: "裝可憐喵", emoji: "🥺", desc: "畀粒零食我食啦～", file: "cat4.mp3" },
      { name: "開心呼嚕", emoji: "🥰", desc: "摸得好舒服，想瞓覺。", file: "cat5.mp3" },
      { name: "興奮鳥鳴", emoji: "🐥", desc: "見到窗外有飛鳥！", file: "cat6.mp3" },
      { name: "告白短喵", emoji: "❤️", desc: "最信任你啦奴才。", file: "cat7.mp3" },
      { name: "放鬆踏踏", emoji: "🐾", desc: "按摩中，請勿打擾。", file: "cat8.mp3" },
      { name: "迎人高音", emoji: "🎉", desc: "好開心見到你返屋企！", file: "cat9.mp3" },
      { name: "滾火低吼", emoji: "😡", desc: "唔好逼我，想咬人！", file: "cat10.mp3" },
      { name: "警告哈氣", emoji: "🐍", desc: "別過嚟！再過嚟我動手！", file: "cat11.mp3" },
      { name: "踩尾尖叫", emoji: "🙀", desc: "踩到我尾巴啦！痛呀！", file: "cat12.mp3" },
      { name: "摸夠收手", emoji: "✋", desc: "摸夠三下，可以退下了。", file: "cat13.mp3" },
      { name: "不耐煩", emoji: "😮‍💨", desc: "好煩呀，我想靜下。", file: "cat14.mp3" },
      { name: "睇窗咔咔", emoji: "🐛", desc: "好想抓抓不到，好心急！", file: "cat15.mp3" },
      { name: "寂寞尋人", emoji: "🔍", desc: "去咗邊呀？屋企好寂寞。", file: "cat16.mp3" },
      { name: "好奇問號", emoji: "❓", desc: "你在做咩呀？畀我睇 Factory。", file: "cat17.mp3" },
      { name: "高級撒嬌", emoji: "😶", desc: "（無聲張嘴）最愛你了。", file: "cat18.mp3" },
      { name: "伸懶腰", emoji: "🧘", desc: "舒服～睡個大覺。", file: "cat19.mp3" },
      { name: "討摸摸", emoji: "🤗", desc: "過嚟摸我頭頭。", file: "cat20.mp3" },
      { name: "打噴嚏", emoji: "🤧", desc: "哈啾！邊個喺度諗我？", file: "cat21.mp3" },
      { name: "嘔毛前奏", emoji: "🤢", desc: "準備定紙巾，我要吐毛球啦。", file: "cat22.mp3" },
      { name: "宵夜召喚", emoji: "🌙", desc: "半夜三更，快啲起身餵我！", file: "cat23.mp3" },
      { name: "霸道佔領", emoji: "💻", desc: "呢個鍵盤現在係我嘅榻榻米。", file: "cat24.mp3" },
      { name: "看穿人類", emoji: "😏", desc: "愚蠢嘅人類，又喺度做咩？", file: "cat25.mp3" },
      { name: "肚餓暴走", emoji: "🏃", desc: "再唔給嘢食，我就開跑跑步！", file: "cat26.mp3" },
      { name: "巡視領地", emoji: "👑", desc: "呢個屋企所有嘢都係朕嘅。", file: "cat27.mp3" },
      { name: "洗臉中", emoji: "🧼", desc: "保持洗臉，做隻精緻嘅貓。", file: "cat28.mp3" },
      { name: "曬太陽", emoji: "☀️", desc: "日光浴中，舒服到要融化。", file: "cat29.mp3" },
      { name: "夢話咕嚕", emoji: "💤", desc: "做緊夢，夢見成河嘅罐罐...", file: "cat30.mp3" }
    ];

    const soundGrid = document.getElementById('soundGrid');
    catSounds.forEach((item) => {
      const btn = document.createElement('div');
      btn.className = 'sound-btn';
      btn.innerHTML = `<span>${item.emoji}</span>${item.name}`;
      btn.onclick = () => playRealCatSound(item);
      soundGrid.appendChild(btn);
    });

    // 🐾 播放內建真貓叫聲 MP3（100% 獨立音訊通道，與背景音樂完全 Overlap 合唱！）
    function playRealCatSound(item) {
      const audio = new Audio(item.file);
      audio.play().catch(e => console.log("Audio play blocked", e));
      showToast(`🐾 貓語：${item.desc}`);
    }

    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    // --- 相片上傳與永久 Save (用戶自訂) ---
    function uploadPhoto(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const caption = prompt("請輸入呢張相嘅名字：", "大寶貓士") || "專屬相片";
          const item = { src: e.target.result, caption: caption };
          const tx = db.transaction("photos", "readwrite");
          tx.objectStore("photos").add(item);
          tx.oncomplete = function() { loadSavedPhotos(); };
        };
        reader.readAsDataURL(file);
      }
    }

    function loadSavedPhotos() {
      const photoGrid = document.getElementById('photoGrid');
      photoGrid.innerHTML = "";
      const tx = db.transaction("photos", "readonly");
      tx.objectStore("photos").openCursor().onsuccess = function(e) {
        const cursor = e.target.result;
        if (cursor) {
          const card = document.createElement('div');
          card.className = 'photo-card';
          card.innerHTML = `
            <button class="delete-btn" onclick="deletePhoto(${cursor.key})">✕</button>
            <img src="${cursor.value.src}" onclick="openLightbox(this.src, '${cursor.value.caption}')">
            <p>${cursor.value.caption}</p>
          `;
          photoGrid.appendChild(card);
          cursor.continue();
        }
      };
    }

    function deletePhoto(id) {
      if (confirm("確定要刪除呢張相片？")) {
        const tx = db.transaction("photos", "readwrite");
        tx.objectStore("photos").delete(id);
        tx.oncomplete = function() { loadSavedPhotos(); };
      }
    }

    // --- MP3 音樂上傳與永久 Save (用戶自訂) ---
    function uploadMusic(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const musicData = { id: "bgm", name: file.name, src: e.target.result };
          const tx = db.transaction("music", "readwrite");
          tx.objectStore("music").put(musicData);
          tx.oncomplete = function() { loadSavedMusic(); };
        };
        reader.readAsDataURL(file);
      }
    }

    function loadSavedMusic() {
      const tx = db.transaction("music", "readonly");
      const store = tx.objectStore("music").get("bgm");
      store.onsuccess = function() {
        if (store.result) {
          document.getElementById('musicName').innerText = "🎵 播放中：" + store.result.name;
          const player = document.getElementById('bgPlayer');
          player.src = store.result.src;
          player.style.display = "block";
        }
      };
    }

    function openLightbox(src, caption) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightboxCaption').innerText = caption;
      document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }
  </script>
</body>
</html>
