<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐾 Open 貓貓 - 終極多媒體相簿混音版</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f7f9fc; color: #333; margin: 0; padding: 15px; padding-bottom: 90px; }
    h1 { text-align: center; color: #ff6b6b; font-size: 26px; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #666; font-size: 15px; margin-top: 0; }
    
    .section-title { font-size: 20px; color: #2d3436; border-left: 5px solid #ff6b6b; padding-left: 10px; margin: 20px 0 12px; font-weight: bold; }
    
    .btn-main { background: #d63031; color: white; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; display: inline-block; }
    .btn-blue { background: #0984e3; color: white; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; display: inline-block; }
    .btn-danger { background: #d63031; color: white; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; display: inline-block; }

    /* 1. 貓貓相簿區 */
    .album-controls { background: #ffeaa7; padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .album-select { padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; font-weight: bold; }
    
    /* 預設兩欄網格 (兩格大圖) */
    .media-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .media-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 3px 6px rgba(0,0,0,0.1); text-align: center; position: relative; padding-bottom: 5px; }
    
    /* 2格時圖片高度為 140px */
    .media-card img, .media-card video { width: 100%; height: 140px; object-fit: cover; cursor: pointer; display: block; }
    .media-card p { margin: 5px 0 2px; font-weight: bold; font-size: 14px; color: #2d3436; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; padding: 0 5px; }
    .delete-btn { position: absolute; top: 5px; right: 5px; background: rgba(214, 48, 49, 0.85); color: white; border: none; border-radius: 50%; width: 26px; height: 26px; font-weight: bold; cursor: pointer; z-index: 10; }

    /* 切換四欄（4格）：16:9 電視機打橫精巧縮圖 */
    .media-grid.four-cols { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .media-grid.four-cols .media-card img, 
    .media-grid.four-cols .media-card video { 
      height: auto; 
      aspect-ratio: 16 / 9;
      object-fit: cover; 
    }
    .media-grid.four-cols .media-card p { font-size: 11px; margin: 3px 0 1px; }

    /* 2. 背景音樂區 */
    .music-box { background: #74b9ff; color: white; padding: 12px; border-radius: 12px; text-align: center; margin-bottom: 15px; }
    .music-box input { display: none; }
    audio { width: 100%; margin-top: 8px; border-radius: 8px; }

    /* 3. 三通道 Mixer 混音器 */
    .mixer-box { background: #2d3436; color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .mixer-title { font-size: 18px; color: #ffeaa7; margin-bottom: 10px; font-weight: bold; text-align: center; }
    .mixer-channel { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; gap: 10px; }
    .mixer-channel label { font-size: 14px; min-width: 110px; font-weight: bold; }
    .mixer-channel input[type=range] { flex: 1; }

    /* 4. 貓聲按鈕區 */
    .sound-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
    .sound-btn { background: white; border: 2px solid #ffeaa7; border-radius: 12px; padding: 10px 5px; text-align: center; cursor: pointer; font-size: 14px; font-weight: bold; color: #d63031; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .sound-btn:active { transform: scale(0.93); background: #ffeaa7; }
    .sound-btn span { display: block; font-size: 22px; margin-bottom: 3px; }

    /* 浮條與全螢幕放大燈箱 */
    .toast-box { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(45, 52, 54, 0.95); color: white; padding: 10px 20px; border-radius: 20px; font-size: 15px; font-weight: bold; display: none; z-index: 2000; text-align: center; max-width: 90%; }
    
    .lightbox { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.92); z-index: 3000; justify-content: center; align-items: center; flex-direction: column; padding: 10px; }
    
    #lightboxContent { width: 100%; height: 85vh; display: flex; justify-content: center; align-items: center; }
    #lightboxContent img, #lightboxContent video { width: 95vw; height: 85vh; object-fit: contain; border-radius: 12px; }
    
    .lightbox p { color: white; font-size: 20px; margin-top: 10px; font-weight: bold; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .close-btn { position: absolute; top: 15px; right: 20px; color: white; font-size: 40px; cursor: pointer; font-weight: bold; z-index: 3100; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
  </style>
</head>
<body>

  <h1>🐾 Open 貓貓助手</h1>
  <p class="subtitle">專屬多媒體相簿 + 離線 MP3 + 三通道 Mixer 混音</p>

  <!-- 1. 🖼️ 專屬貓貓相簿區 -->
  <div class="section-title">🖼️ 貓貓專屬多媒體相簿</div>
  <div class="album-controls">
    <select id="albumSelect" class="album-select" onchange="switchAlbum()">
      <option value="default">📁 預設貓貓相簿</option>
    </select>
    <button class="btn-blue" onclick="createAlbum()">➕ 新建相簿</button>
    <button class="btn-danger" onclick="deleteCurrentAlbum()">🗑️ 刪除相簿</button>
    <label class="btn-main" for="mediaInput">📸 揼入相片/影片 (可多選)</label>
    <input type="file" id="mediaInput" accept="image/*,video/*" multiple style="display:none;" onchange="uploadMedia(event)">
    <button class="btn-blue" style="background:#6c5ce7;" onclick="toggleGrid()">📐 切換 2格/4格(16:9)</button>
  </div>
  <div class="media-grid" id="mediaGrid"></div>

  <!-- 2. 🎵 專屬背景音樂區 -->
  <div class="section-title">🎵 專屬背景音樂 (MP3)</div>
  <div class="music-box">
    <label class="btn-blue" for="musicInput">➕ 選擇自訂 MP3</label>
    <input type="file" id="musicInput" accept="audio/*" onchange="uploadMusic(event)">
    <div id="musicName" style="margin-top: 6px; font-weight: bold;">（未選擇音樂）</div>
    <audio id="bgPlayer" controls style="display: none;"></audio>
  </div>

  <!-- 3. 🎛️ 三通道 Mixer 混音器 -->
  <div class="mixer-box">
    <div class="mixer-title">🎛️ 聲音 Mixer 混音主控台</div>
    <div class="mixer-channel">
      <label>🎵 背景 MP3：</label>
      <input type="range" id="volBgm" min="0" max="1" step="0.05" value="0.8" oninput="updateVolumes()">
    </div>
    <div class="mixer-channel">
      <label>🐱 貓貓真聲：</label>
      <input type="range" id="volCat" min="0" max="1" step="0.05" value="1.0" oninput="updateVolumes()">
    </div>
    <div class="mixer-channel">
      <label>🎬 影片原聲：</label>
      <input type="range" id="volVideo" min="0" max="1" step="0.05" value="0.9" oninput="updateVolumes()">
    </div>
  </div>

  <!-- 4. 🔊 30 種真貓語解密 -->
  <div class="section-title">🔊 30 種真貓語解密（即點即播）</div>
  <div class="sound-grid" id="soundGrid"></div>

  <!-- 底部 Toast 與 全螢幕放大燈箱 -->
  <div class="toast-box" id="toast"></div>
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="close-btn">&times;</span>
    <div id="lightboxContent"></div>
    <p id="lightboxCaption"></p>
  </div>

  <script>
    let db;
    let currentAlbum = "default";
    let currentCatAudio = null;
    let currentActiveVideo = null;

    const request = indexedDB.open("OpenMeowMasterDB", 2);
    request.onupgradeneeded = function(e) {
      db = e.target.result;
      if (!db.objectStoreNames.contains("media")) db.createObjectStore("media", { keyPath: "id", autoIncrement: true });
      if (!db.objectStoreNames.contains("albums")) db.createObjectStore("albums", { keyPath: "id" });
      if (!db.objectStoreNames.contains("music")) db.createObjectStore("music", { keyPath: "id" });
    };
    request.onsuccess = function(e) {
      db = e.target.result;
      loadAlbums();
      loadMedia();
      loadSavedMusic();
    };

    // 🐾 30 個真貓聲檔案綁定
    const catSounds = [
      { name: "打招呼喵", emoji: "😺", desc: "奴才你返嚟啦！", file: "cat1.mp3" },
      { name: "要罐罐喵", emoji: "🍖", desc: "快啲開罐罐！急需要！", file: "cat2.mp3" },
      { name: "急促討食", emoji: "⚡", desc: "動作太慢，扣 50 分！", file: "cat3.mp3" },
      { name: "裝可憐喵", emoji: "🥺", desc: "畀粒零食我食啦～", file: "cat4.mp3" },
      { name: "開心呼嚕", emoji: "🥰", desc: "摸得好舒服，想瞓覺。", file: "cat5.mp3" },
      { name: "興奮鳥鳴", emoji: "🐥", desc: "見到窗外有飛鳥！", file: "cat6.mp3" },
      { name: "告白短喵", emoji: "❤️", desc: "最信任你啦奴才。", file: "cat7.mp3" },
      { name: "放鬆踏踏", emoji: "🐾", desc: "按摩中，請勿打擾。", file: "cat8.mp3" },
      { name: "迎人高音", emoji: "🎉", desc: "好開心見到你返屋企！", file: "cat9.mp3" },
      { name: "滾火低吼", emoji: "😡", desc: "唔好逼我，想咬人！", file: "cat10.mp3" },
      { name: "警告哈氣", emoji: "🐍", desc: "別過嚟！再過嚟我動手！", file: "cat11.mp3" },
      { name: "踩尾尖叫", emoji: "🙀", desc: "踩到我尾巴啦！痛呀！", file: "cat12.mp3" },
      { name: "摸夠收手", emoji: "✋", desc: "摸夠三下，可以退下了。", file: "cat13.mp3" },
      { name: "不耐煩", emoji: "😮‍💨", desc: "好煩呀，我想靜下。", file: "cat14.mp3" },
      { name: "睇窗咔咔", emoji: "🐛", desc: "好想抓抓不到，好心急！", file: "cat15.mp3" },
      { name: "寂寞尋人", emoji: "🔍", desc: "去咗邊呀？屋企好寂寞。", file: "cat16.mp3" },
      { name: "好奇問號", emoji: "❓", desc: "你在做咩呀？", file: "cat17.mp3" },
      { name: "高級撒嬌", emoji: "😶", desc: "（無聲張嘴）最愛你了。", file: "cat18.mp3" },
      { name: "伸懶腰", emoji: "🧘", desc: "舒服～睡個大覺。", file: "cat19.mp3" },
      { name: "討摸摸", emoji: "🤗", desc: "過嚟摸我頭頭。", file: "cat20.mp3" },
      { name: "打噴嚏", emoji: "🤧", desc: "哈啾！邊個喺度諗我？", file: "cat21.mp3" },
      { name: "嘔毛前奏", emoji: "🤢", desc: "準備定紙巾，我要吐毛球啦。", file: "cat22.mp3" },
      { name: "宵夜召喚", emoji: "🌙", desc: "半夜三更，快啲起身餵我！", file: "cat23.mp3" },
      { name: "霸道佔領", emoji: "💻", desc: "呢個鍵盤現在係我嘅榻榻米。", file: "cat24.mp3" },
      { name: "看穿人類", emoji: "😏", desc: "愚蠢嘅人類，又喺度做咩？", file: "cat25.mp3" },
      { name: "肚餓暴走", emoji: "🏃", desc: "再唔給嘢食，我就開跑跑步！", file: "cat26.mp3" },
      { name: "巡視領地", emoji: "👑", desc: "呢個屋企所有嘢都係朕嘅。", file: "cat27.mp3" },
      { name: "洗臉中", emoji: "🧼", desc: "保持洗臉，做隻精緻嘅貓。", file: "cat28.mp3" },
      { name: "曬太陽", emoji: "☀️", desc: "日光浴中，舒服到要融化。", file: "cat29.mp3" },
      { name: "夢話咕嚕", emoji: "💤", desc: "做緊夢，夢見成河嘅罐罐...", file: "cat30.mp3" }
    ];

    const soundGrid = document.getElementById('soundGrid');
    catSounds.forEach((item) => {
      const btn = document.createElement('div');
      btn.className = 'sound-btn';
      btn.innerHTML = `<span>${item.emoji}</span>${item.name}`;
      btn.onclick = () => playRealCatSound(item);
      soundGrid.appendChild(btn);
    });

    // 🎛️ 音量實時控制
    function updateVolumes() {
      const bgPlayer = document.getElementById('bgPlayer');
      if (bgPlayer) bgPlayer.volume = document.getElementById('volBgm').value;
      if (currentCatAudio) currentCatAudio.volume = document.getElementById('volCat').value;
      if (currentActiveVideo) currentActiveVideo.volume = document.getElementById('volVideo').value;
    }

    function playRealCatSound(item) {
      if (currentCatAudio) { currentCatAudio.pause(); }
      currentCatAudio = new Audio(item.file);
      currentCatAudio.volume = document.getElementById('volCat').value;
      currentCatAudio.play().catch(e => console.log("Cat audio play blocked", e));
      showToast(`🐾 貓語：${item.desc}`);
    }

    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    // --- 相簿管理 (新增、刪除) ---
    function createAlbum() {
      const name = prompt("請輸入新相簿名稱：", "黑貓仔寫真");
      if (name) {
        const id = "album_" + Date.now();
        const tx = db.transaction("albums", "readwrite");
        tx.objectStore("albums").add({ id: id, name: name });
        tx.oncomplete = function() { loadAlbums(id); };
      }
    }

    function deleteCurrentAlbum() {
      if (currentAlbum === "default") {
        alert("⚠️ 「預設貓貓相簿」係系統保護相簿，唔可以刪除呀！");
        return;
      }

      // 檢查相簿內是否有檔案
      const tx = db.transaction("media", "readonly");
      let count = 0;
      tx.objectStore("media").openCursor().onsuccess = function(e) {
        const cursor = e.target.result;
        if (cursor) {
          if (cursor.value.albumId === currentAlbum) count++;
          cursor.continue();
        } else {
          let confirmMsg = "確定要刪除呢個相簿？";
          if (count > 0) confirmMsg = `⚠️ 呢個相簿入面仲有 ${count} 個檔案！確定要連埋啲相一齊刪除？`;
          
          if (confirm(confirmMsg)) {
            // 刪除相簿紀錄
            const txAlbum = db.transaction("albums", "readwrite");
            txAlbum.objectStore("albums").delete(currentAlbum);
            
            // 刪除相簿內的相片/影片
            const txMedia = db.transaction("media", "readwrite");
            const storeMedia = txMedia.objectStore("media");
            storeMedia.openCursor().onsuccess = function(ev) {
              const c = ev.target.result;
              if (c) {
                if (c.value.albumId === currentAlbum) c.delete();
                c.continue();
              }
            };

            txMedia.oncomplete = function() {
              showToast("🗑️ 相簿已成功刪除！");
              loadAlbums("default");
            };
          }
        }
      };
    }

    function loadAlbums(selectId) {
      const select = document.getElementById('albumSelect');
      select.innerHTML = '<option value="default">📁 預設貓貓相簿</option>';
      const tx = db.transaction("albums", "readonly");
      tx.objectStore("albums").openCursor().onsuccess = function(e) {
        const cursor = e.target.result;
        if (cursor) {
          const opt = document.createElement('option');
          opt.value = cursor.value.id;
          opt.innerText = "📁 " + cursor.value.name;
          select.appendChild(opt);
          cursor.continue();
        } else {
          if (selectId) select.value = selectId;
          currentAlbum = select.value;
          loadMedia();
        }
      };
    }

    function switchAlbum() {
      currentAlbum = document.getElementById('albumSelect').value;
      loadMedia();
    }

    function toggleGrid() {
      document.getElementById('mediaGrid').classList.toggle('four-cols');
    }

    // --- 批次（多選）上傳相片/影片 ---
    function uploadMedia(event) {
      const files = Array.from(event.target.files);
      if (files.length > 0) {
        let loadedCount = 0;
        files.forEach(file => {
          const reader = new FileReader();
          const isVideo = file.type.startsWith('video/');
          reader.onload = function(e) {
            const item = { albumId: currentAlbum, src: e.target.result, caption: file.name.split('.')[0], isVideo: isVideo };
            const tx = db.transaction("media", "readwrite");
            tx.objectStore("media").add(item);
            tx.oncomplete = function() {
              loadedCount++;
              if (loadedCount === files.length) {
                loadMedia();
                showToast(`✅ 成功揼入 ${files.length} 個多媒體檔案！`);
              }
            };
          };
          reader.readAsDataURL(file);
        });
      }
    }

    function loadMedia() {
      const mediaGrid = document.getElementById('mediaGrid');
      mediaGrid.innerHTML = "";
      const tx = db.transaction("media", "readonly");
      tx.objectStore("media").openCursor().onsuccess = function(e) {
        const cursor = e.target.result;
        if (cursor) {
          if (cursor.value.albumId === currentAlbum) {
            const card = document.createElement('div');
            card.className = 'media-card';
            if (cursor.value.isVideo) {
              card.innerHTML = `
                <button class="delete-btn" onclick="deleteMedia(${cursor.key})">✕</button>
                <video src="${cursor.value.src}" onclick="openLightboxMedia('${cursor.value.src}', '${cursor.value.caption}', true)"></video>
                <p>🎬 ${cursor.value.caption}</p>
              `;
            } else {
              card.innerHTML = `
                <button class="delete-btn" onclick="deleteMedia(${cursor.key})">✕</button>
                <img src="${cursor.value.src}" onclick="openLightboxMedia('${cursor.value.src}', '${cursor.value.caption}', false)">
                <p>📷 ${cursor.value.caption}</p>
              `;
            }
            mediaGrid.appendChild(card);
          }
          cursor.continue();
        }
      };
    }

    function deleteMedia(id) {
      if (confirm("確定要刪除呢個檔案？")) {
        const tx = db.transaction("media", "readwrite");
        tx.objectStore("media").delete(id);
        tx.oncomplete = function() { loadMedia(); };
      }
    }

    // --- 背景 MP3 管理 ---
    function uploadMusic(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const musicData = { id: "bgm", name: file.name, src: e.target.result };
          const tx = db.transaction("music", "readwrite");
          tx.objectStore("music").put(musicData);
          tx.oncomplete = function() { loadSavedMusic(); };
        };
        reader.readAsDataURL(file);
      }
    }

    function loadSavedMusic() {
      const tx = db.transaction("music", "readonly");
      const store = tx.objectStore("music").get("bgm");
      store.onsuccess = function() {
        if (store.result) {
          document.getElementById('musicName').innerText = "🎵 播放中：" + store.result.name;
          const player = document.getElementById('bgPlayer');
          player.src = store.result.src;
          player.style.display = "block";
          updateVolumes();
        }
      };
    }

    // 全螢幕極致放大燈箱
    function openLightboxMedia(src, caption, isVideo) {
      const content = document.getElementById('lightboxContent');
      if (isVideo) {
        content.innerHTML = `<video id="activeVideo" src="${src}" controls autoplay></video>`;
        document.getElementById('lightboxCaption').innerText = "🎬 " + caption;
        document.getElementById('lightbox').style.display = 'flex';
        
        setTimeout(() => {
          currentActiveVideo = document.getElementById('activeVideo');
          if (currentActiveVideo) {
            currentActiveVideo.volume = document.getElementById('volVideo').value;
          }
        }, 100);
      } else {
        content.innerHTML = `<img src="${src}">`;
        document.getElementById('lightboxCaption').innerText = "📷 " + caption;
        document.getElementById('lightbox').style.display = 'flex';
        currentActiveVideo = null;
      }
    }

    function closeLightbox() {
      if (currentActiveVideo) {
        currentActiveVideo.pause();
        currentActiveVideo = null;
      }
      document.getElementById('lightbox').style.display = 'none';
      document.getElementById('lightboxContent').innerHTML = "";
    }
  </script>
</body>
</html>
